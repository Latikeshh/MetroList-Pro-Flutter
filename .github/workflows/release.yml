name: Bump to new version
on:
  push:
    branches:
      - "main"
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      # Only HEAD and HEAD^ are read below, and no submodule or Gradle work
      # happens in this job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "File app/build.gradle.kts does not exist"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Current version: $NEW_VERSION (code: $VERSION_CODE)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual release requested for version $NEW_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
            echo "Previous version: $OLD_VERSION"
            
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged: $NEW_VERSION"
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "First version detected: $NEW_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

      - name: Debug output
        run: |
          echo "Debug Information:"
          echo "  - version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "  - new_version: ${{ steps.check_version.outputs.new_version }}"
          echo "  - version_code: ${{ steps.check_version.outputs.version_code }}"
          echo "  - event_name: ${{ github.event_name }}"

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Read-only: release builds reuse the dependency and build caches
          # written by main without publishing entries of their own.
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No `clean`: the runner is ephemeral, so there is nothing to clean and
      # it only discards restored cache entries.
      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.pro
          METROLIST_APP_NAME: Metrolist Pro
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare Release APKs
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"

          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="Metrolist-Pro-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            TARGET_NAME="Metrolist-Pro-izzy.apk"
          else
            TARGET_NAME="Metrolist-Pro.apk"
          fi

          BUILD_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$BUILD_APK" ]; then
            cp "$BUILD_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
            echo "Release APK prepared: $TARGET_NAME"
          else
            echo "No APK found for ${{ matrix.variant }}"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

          ls -la "$OUTPUT_DIR/out/"

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'gms' && 'Metrolist-Pro-with-Google-Cast' || matrix.variant == 'izzy' && 'Metrolist-Pro-izzy' || 'Metrolist-Pro' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  build_windows:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    name: Build Windows Desktop
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Visual Studio C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          Remove-Item -Recurse -Force build\windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force windows\flutter\ephemeral -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:FLUTTER_CMAKE_GENERATOR -ErrorAction SilentlyContinue
          flutter build windows --release -v
          $releaseDir = "build\windows\x64\runner\Release"
          if (!(Test-Path $releaseDir) -or !(Get-ChildItem $releaseDir -Filter "*.exe")) {
            throw "Windows release output is missing"
          }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "Metrolist-Pro-Windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Windows-x64
          path: Metrolist-Pro-Windows-x64.zip
          if-no-files-found: error

  build_ios:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    name: Build iOS Desktop
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Build iOS release (unsigned)
        run: |
          flutter config --enable-ios
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          zip -r ../../../Metrolist-Pro-iOS.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-iOS
          path: Metrolist-Pro-iOS.zip
          if-no-files-found: error

  build_macos:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    name: Build macOS Desktop
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Build macOS release
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Metrolist-Pro-macOS.zip metrolist_pro.app

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-macOS
          path: Metrolist-Pro-macOS.zip
          if-no-files-found: error

  create-release:
    needs: [check-version, build, build_windows, build_ios, build_macos]
    if: always() && needs.check-version.outputs.version_changed == 'true' && needs.build.result == 'success' && needs.build_windows.result == 'success' && needs.build_ios.result == 'success' && needs.build_macos.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts/

      - name: Organize and validate all platform assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files
          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.zip" \) -exec cp {} release_files/ \;

          echo "Release assets:"
          ls -lah release_files/

          required_assets=(
            "Metrolist-Pro.apk"
            "Metrolist-Pro-with-Google-Cast.apk"
            "Metrolist-Pro-izzy.apk"
            "Metrolist-Pro-Windows-x64.zip"
            "Metrolist-Pro-iOS.zip"
            "Metrolist-Pro-macOS.zip"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -s "release_files/$asset" ]]; then
              echo "::error::Required release asset missing or empty: $asset"
              exit 1
            fi
          done
      - name: Parse release notes from changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          chmod +x .github/scripts/parse_changelog.sh

          if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md; then
            echo "Release notes sourced from changelog.md for v$VERSION"
            echo "--- Preview (first 20 lines) ---"
            head -20 release_notes.md
          else
            echo "::warning::v$VERSION not found in changelog.md — falling back to git log"
            {
              echo "Release of version $VERSION"
              echo ""
              git log "$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD" \
                --pretty=format:"- %s" --no-merges | head -10 || echo "- Initial release"
            } > release_notes.md
            echo "--- Fallback notes ---"
            cat release_notes.md
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Creating release v${{ needs.check-version.outputs.new_version }}"

          {
            echo "Released by @${{ github.triggering_actor }}"
            echo ""
            cat release_notes.md
          } > attributed_release_notes.md

          gh release create "v${{ needs.check-version.outputs.new_version }}" \
            --title "${{ needs.check-version.outputs.new_version }}" \
            --notes-file attributed_release_notes.md \
            --latest \
            release_files/*.apk release_files/*.zip

          echo "Release created successfully!"

      - name: Update release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ needs.check-version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Released by**: @${{ github.triggering_actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android APKs**: $(find release_files -maxdepth 1 -name '*.apk' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Desktop/mobile platform ZIPs**: $(find release_files -maxdepth 1 -name '*.zip' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
