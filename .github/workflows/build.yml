name: Build Metrolist Pro (Android & Windows)

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
    paths-ignore:
      - "README.md"
      - "*.md"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop Target
        run: flutter config --enable-windows-desktop

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Release Build
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Metrolist-Pro-Windows-x64.zip"

      - name: Upload Windows Desktop Zip
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Windows-x64
          path: Metrolist-Pro-Windows-x64.zip
