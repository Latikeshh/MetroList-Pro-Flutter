name: Build & Release Metrolist Pro (Android, Windows, iOS, macOS, Web)

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/**"]
    paths-ignore:
      - "README.md"
      - "*.md"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android App (APK Zip)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package Android Build into ZIP
        run: |
          mkdir -p android_out
          cp build/app/outputs/flutter-apk/app-release.apk android_out/Metrolist-Pro-Android.apk
          cd android_out && zip -r ../Metrolist-Pro-Android.zip Metrolist-Pro-Android.apk

      - name: Upload Android ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Android
          path: Metrolist-Pro-Android.zip

  build_windows:
    name: Build Windows Desktop App (ZIP)
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Visual Studio C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop Target
        run: flutter config --enable-windows-desktop

      - name: Clean Flutter project
        run: flutter clean

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Remove stale Windows CMake build state
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force windows\flutter\ephemeral -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_GENERATOR_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:FLUTTER_CMAKE_GENERATOR -ErrorAction SilentlyContinue

      - name: Verify Visual Studio C++ toolchain
        shell: pwsh
        run: |
          flutter doctor -v
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }

      - name: Build Windows Executable
        shell: pwsh
        env:
          FLUTTER_CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"
        run: flutter build windows --release -v

      - name: Verify Windows Release Output
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (!(Test-Path "$releaseDir\metrolist_pro.exe")) {
            Write-Error "Expected executable not found at $releaseDir\metrolist_pro.exe"
            Get-ChildItem -Recurse build\windows | Select-Object -First 100 FullName
            exit 1
          }

      - name: Compress Windows Build into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Metrolist-Pro-Windows-x64.zip" -Force

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Windows-x64
          path: Metrolist-Pro-Windows-x64.zip

  build_ios:
    name: Build iOS App (ZIP)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Enable iOS Target
        run: flutter config --enable-ios

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS App into ZIP
        run: |
          cd build/ios/iphoneos && zip -r ../../../Metrolist-Pro-iOS.zip Runner.app

      - name: Upload iOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-iOS
          path: Metrolist-Pro-iOS.zip

  build_macos:
    name: Build macOS Desktop App (ZIP)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Enable macOS Desktop Target
        run: flutter config --enable-macos-desktop

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build macOS Executable
        run: flutter build macos --release

      - name: Compress macOS Build into ZIP
        run: |
          cd build/macos/Build/Products/Release && zip -r ../../../../../Metrolist-Pro-macOS.zip metrolist_pro.app

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-macOS
          path: Metrolist-Pro-macOS.zip

  build_web:
    name: Build Web App & Deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release --base-href "/MetroList-Pro-Flutter/"

      - name: Package Web Build into ZIP
        run: |
          cd build/web && zip -r ../../Metrolist-Pro-Web.zip *

      - name: Upload Web ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Pro-Web
          path: Metrolist-Pro-Web.zip

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  publish_release:
    name: Publish GitHub Nightly Release
    if: always() && (needs.build_android.result == 'success' || needs.build_windows.result == 'success' || needs.build_ios.result == 'success' || needs.build_macos.result == 'success' || needs.build_web.result == 'success')
    needs: [build_android, build_windows, build_ios, build_macos, build_web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Metrolist-Pro-Android
          path: release_files

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Metrolist-Pro-Windows-x64
          path: release_files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Metrolist-Pro-iOS
          path: release_files

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Metrolist-Pro-macOS
          path: release_files

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Metrolist-Pro-Web
          path: release_files

      - name: Publish GitHub Nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Release Files Ready:"
          ls -la release_files/

          ATTACHMENTS=$(find release_files -name "*.zip" -o -name "*.apk")
          if [ -z "$ATTACHMENTS" ]; then
            echo "No build artifacts found to release."
            exit 1
          fi

          PREVIOUS_NIGHTLY_SHA=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          {
            echo "Automated cross-platform build from main at commit $GITHUB_SHA."
            echo ""
            echo "### Downloads for All Platforms"
            echo "* **Live Web App:** https://latikeshh.github.io/MetroList-Pro-Flutter/"
            echo "* **Android:** Metrolist-Pro-Android.zip"
            echo "* **Windows:** Metrolist-Pro-Windows-x64.zip"
            echo "* **iOS:** Metrolist-Pro-iOS.zip"
            echo "* **macOS:** Metrolist-Pro-macOS.zip"
            echo "* **Web Package:** Metrolist-Pro-Web.zip"
            if [ -n "$PREVIOUS_NIGHTLY_SHA" ] && [ "$PREVIOUS_NIGHTLY_SHA" != "$GITHUB_SHA" ]; then
              echo
              echo "## Changes since previous build"
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_NIGHTLY_SHA...$GITHUB_SHA" \
                --jq '.commits[] | "* \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            fi
          } > release-notes.md

          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi

          gh release create nightly \
            release_files/* \
            --target "$GITHUB_SHA" \
            --title "Metrolist Pro Nightly Release" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
